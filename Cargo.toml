[package]
name = "speq"
version = "0.1.0"
edition = "2024"
# 1.89: std file locking (`File::lock`) and the minimum of the keyring/time/uuid crates.
rust-version = "1.89"
description = "Speq CLI: work on product specs with Git commands, through the Speq API"
license = "UNLICENSED"
publish = false
build = "build.rs"

[lib]
name = "speq"
path = "src/lib.rs"

[[bin]]
name = "speq"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions", "color"] }
directories = "6.0.0"
getrandom = "0.4.3"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
# Already in the tree as rustls's crypto provider; verifies the Ed25519 signature on release manifests.
ring = { version = "0.17.14", default-features = false }
reqwest ={ version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
# Already in the tree through tempfile; gives the effective user ID without `unsafe`.
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
