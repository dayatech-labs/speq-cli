# Automatic release on every push to `main`. The version and the tag come from the commit history
# (conventional commits, see scripts/next_version.py): feat -> minor, fix/perf/refactor -> patch,
# breaking -> major (minor before 1.0); docs/chore/test/ci-only pushes release nothing.
#
# Every target is built from the same commit, tested, and smoke-tested, then the GitHub Release is
# published in one step (draft -> assets -> publish). The tag is created at that last step, on the
# built commit, so a failed build never leaves a tag behind. (Tags made with GITHUB_TOKEN do not
# trigger other workflows, which is why this workflow runs on `main`, not on tags.)
# The repository must be public so installers can download anonymously.
#
# Supply chain: a manual run releases only from `main` (`plan` is skipped on any other ref, and every
# later job needs it). Actions are pinned to full commit SHAs (the tag is in the comment), and no
# checkout keeps the token in .git/config.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Releases are serialised: two quick pushes never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    # `workflow_dispatch` lets the caller pick any branch; only reviewed `main` may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Release scripts are correct
        run: python3 scripts/test_release_scripts.py
      - id: next
        run: |
          python3 scripts/next_version.py | tee -a "$GITHUB_OUTPUT"
          if grep -q '^tag=' "$GITHUB_OUTPUT" && git rev-parse -q --verify "refs/tags/$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT")" >/dev/null; then
            echo "tag already exists; refusing to release twice"; exit 1
          fi

  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
      - name: Installer scripts are valid
        run: |
          sh -n scripts/install.sh
          shellcheck -S warning scripts/install.sh
          python3 -m py_compile scripts/release_manifest.py scripts/render_packaging.py scripts/next_version.py scripts/stamp_version.py

  build:
    needs: [plan, verify]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, exe: "", pack: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: "", pack: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, exe: "", pack: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe", pack: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SPEQ_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp the release version (CI only, not committed)
        run: python3 scripts/stamp_version.py "${{ needs.plan.outputs.version }}"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          out=$(target/${{ matrix.target }}/release/speq${{ matrix.exe }} --version)
          echo "$out"
          echo "$out" | grep -q "speq ${{ needs.plan.outputs.version }}"
          echo "$out" | grep -q "commit: ${{ github.sha }}"
          echo "$out" | grep -q "target: ${{ matrix.target }}"
      - name: Package
        run: |
          version="${{ needs.plan.outputs.version }}"
          target="${{ matrix.target }}"
          mkdir -p dist stage
          cp "target/$target/release/speq${{ matrix.exe }}" "dist/speq-$version-$target${{ matrix.exe }}"
          cp "target/$target/release/speq${{ matrix.exe }}" "stage/speq${{ matrix.exe }}"
          cp README.md stage/
          # Git runs speq as git-remote-speq and git-credential-speq: copies on Windows, links elsewhere.
          for helper in git-remote-speq git-credential-speq; do
            if [ "${{ matrix.pack }}" = "zip" ]; then cp stage/speq.exe "stage/$helper.exe"; else ln -s speq "stage/$helper"; fi
          done
          if [ "${{ matrix.pack }}" = "zip" ]; then
            (cd stage && 7z a -tzip "../dist/speq-$version-$target.zip" .)
          else
            tar -czf "dist/speq-$version-$target.tar.gz" -C stage .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    # Holds SPEQ_RELEASE_SIGNING_KEY; restrict it to `main` (and reviewers) in the repository settings.
    environment: release
    permissions:
      contents: write
    steps:
      # The write token is only for `gh` below (GH_TOKEN); repository scripts never see it on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums, manifest, installers, package-manager files
        run: |
          version="${{ needs.plan.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/v$version"
          python3 scripts/release_manifest.py dist "$version" "${{ github.sha }}" "$base"
          python3 scripts/render_packaging.py dist "$version" dist
          cp scripts/install.sh scripts/install.ps1 dist/
          ls -l dist
      # `speq upgrade` believes a manifest only with a signature by one of RELEASE_KEYS (src/upgrade.rs).
      - name: Sign the manifest and checksums
        env:
          SIGNING_KEY: ${{ secrets.SPEQ_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "SPEQ_RELEASE_SIGNING_KEY is not set in the release environment"; exit 1; }
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          public=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          # A signature by a key the released binaries do not hold would stop every future upgrade.
          grep -q "\"$public\"" src/upgrade.rs || { echo "the signing key is not in RELEASE_KEYS (src/upgrade.rs)"; exit 1; }
          for file in manifest.json SHA256SUMS; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "dist/$file" -out "dist/$file.sig"
            openssl pkeyutl -verify -rawin -inkey "$key" -in "dist/$file" -sigfile "dist/$file.sig"
          done
      - name: Publish atomically (draft, upload, then publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.plan.outputs.tag }}"
          # The tag does not exist yet: publishing the release creates it on the built commit.
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "speq $tag" --generate-notes
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false --latest

  verify-install:
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install the published release (Unix)
        if: runner.os != 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/${{ github.repository }}/releases/download/v${{ needs.plan.outputs.version }}/install.sh" | sh -s -- --version "${{ needs.plan.outputs.version }}"
          "$HOME/.local/bin/speq" --version
          "$HOME/.local/bin/speq" help > /dev/null
          "$HOME/.local/bin/speq" upgrade --check
      - name: Install the published release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ needs.plan.outputs.version }}"
          $script = Invoke-RestMethod "https://github.com/${{ github.repository }}/releases/download/v$v/install.ps1"
          & ([scriptblock]::Create($script)) -Version $v
          $exe = Join-Path $env:LOCALAPPDATA "Speq\bin\speq.exe"
          & $exe --version
          & $exe help | Out-Null
          & $exe upgrade --check
      # Windows PowerShell 5.1 is the only PowerShell many users have; it differs from pwsh in .NET APIs.
      - name: Install the published release (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $v = "${{ needs.plan.outputs.version }}"
          $script = Invoke-RestMethod "https://github.com/${{ github.repository }}/releases/download/v$v/install.ps1"
          & ([scriptblock]::Create($script)) -Version $v
          & (Join-Path $env:LOCALAPPDATA "Speq\bin\speq.exe") --version

  # Announces the release once the published installers work. GOOGLE_CHAT_WEBHOOK_URL is a repository secret
  # (the URL is the credential); without it the release still succeeds and the run shows a warning.
  notify:
    needs: [plan, verify-install]
    runs-on: ubuntu-latest
    steps:
      - name: Announce the release in Google Chat
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}
        run: |
          [ -n "$WEBHOOK_URL" ] || { echo "::warning::GOOGLE_CHAT_WEBHOOK_URL is not set; no release announcement"; exit 0; }
          text=$(printf '*speq %s* is released and installs on Linux, macOS and Windows.\n<%s|Release notes> · commit %s\nUpgrade: `speq upgrade`' \
            "$TAG" "$RELEASE_URL" "${GITHUB_SHA:0:7}")
          jq -n --arg text "$text" '{text: $text}' |
            curl --proto '=https' -fsS --retry 3 -o /dev/null -H 'Content-Type: application/json; charset=UTF-8' --data-binary @- "$WEBHOOK_URL"
